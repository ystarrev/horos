		5F026FFC24212E630083A650 /* Sign */ = {
			isa = PBXShellScriptBuildPhase;
			name = Sign;
			outputPaths = (
				"$(TARGET_TEMP_DIR)/Sign.stamp",
			);
			shellPath = /bin/sh;
			shellScript = (
				"# Need to sign command-line executables. The identity defined must exist as",
				"# a certificate in the build user's keychain. If it does not, this step will",
				"# fail. Edit identity to a one that does (e.g., \"Developer ID Application\").",
				"#",
				"",
				"set -e; set -o xtrace",
				"",
				"if [ \"$CODE_SIGNING_ALLOWED\" = \"NO\" ]; then",
				"  echo \"Code signing disabled, skipping DCMTK sign\"",
				"  mkdir -p \"$TARGET_TEMP_DIR\"",
				"  touch \"$TARGET_TEMP_DIR/Sign.stamp\"",
				"  exit 0",
				"fi",
				"",
				"identity=\"$DEVELOPMENT_TEAM\"",
				"prefix=\"org.horosproject.\"",
				"copy_dir=\"$BUILT_PRODUCTS_DIR/DCMTK\"",
				"",
				"if ! security find-identity -v -p codesigning | grep -q \"${identity}\"; then",
				"  echo \"Code signing identity '${identity}' not found; skipping DCMTK sign\"",
				"  mkdir -p \"$TARGET_TEMP_DIR\"",
				"  touch \"$TARGET_TEMP_DIR/Sign.stamp\"",
				"  exit 0",
				"fi",
				"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/dcmdump\"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/dcmpsprt\"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/dcmprscu\"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/dsr2html\"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/echoscu\"",
				"codesign --verbose=4 -f --prefix \"${prefix}\" --options runtime -s \"${identity}\" \"${copy_dir}/libHorosModernDCMTKBridge.dylib\"",
				"mkdir -p \"$TARGET_TEMP_DIR\"",
				"touch \"$TARGET_TEMP_DIR/Sign.stamp\"",
				"",
			);
		};
